// CI-only, remap the pinned production Player Animator jar for the dev client.
allprojects { project ->
    // The pinned jar is local. Never ask Forge Maven for this synthetic CI
    // coordinate: a remote outage otherwise aborts resolution before flatDir.
    repositories.exclusiveContent {
        forRepository { project.repositories.flatDir { dirs project.file('.ci/playeranim-dependency') } }
        // ForgeGradle synthesizes a separate mapped version in its own repo.
        filter { includeVersion('ci', 'playeranim', '1.0.2') }
    }
    afterEvaluate {
        dependencies.add('runtimeOnly', project.fg.deobf('ci:playeranim:1.0.2'))
    }
}
allprojects { project ->
    tasks.configureEach { task ->
        if (task.name == 'runClient' || task.name == 'runServer') {
            task.dependsOn('createSrgToMcp')
            task.doFirst {
                def args = task.getRunConfig().get().getJvmArgs()
                args.add('-Dmixin.env.remapRefMap=true')
                args.add('-Dmixin.env.refMapRemappingFile=' + project.file('build/createSrgToMcp/output.srg').absolutePath)
            }
        }
    }
}
