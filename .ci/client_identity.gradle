// CI only: configure ForgeGradle's lazily-created run tasks when they appear.
// Replace any inherited username and cap the three concurrent game JVMs.
allprojects { project ->
    tasks.configureEach { runTask ->
        if (runTask.name == 'runClient' || runTask.name == 'runServer') {
            runTask.doFirst {
                def config = runTask.getRunConfig().get()
                config.getJvmArgs().add('-Xmx768m')
                if (runTask.name == 'runServer') runTask.setStandardInput(System.in)
                def requestedName = project.findProperty('ciUsername')
                if (runTask.name == 'runClient' && requestedName) {
                    def args = config.getArgs()
                    for (int i = args.size() - 2; i >= 0; --i) {
                        if (args[i] == '--username' || args[i] == '--uuid') {
                            args.remove(i + 1)
                            args.remove(i)
                        }
                    }
                    args.add('--username')
                    args.add(requestedName.toString())
                    println("CI launch identity ${requestedName}: ${args}")
                }
            }
        }
    }
}
