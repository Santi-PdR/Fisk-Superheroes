name: Beretta Visual Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/beretta_visual_smoke.py'
      - '.github/workflows/beretta-visual-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/Beretta93RItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemBeretta93R.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemGun.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/WeaponHandRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroSuitLayer.java'
      - 'src/main/resources/assets/fiskheroes/models/heroes/wild_dog.json'
      - 'src/main/java/com/fiskmods/heroes/client/render/DualWieldVisuals.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitItemRenderContext.java'
concurrency:
  group: beretta-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beretta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare diagnostic texture on the runner only
        run: |
          chmod +x gradlew
          mkdir -p run-beretta-server run-beretta-client/config
          printf 'earlyWindowControl = false\n' > run-beretta-client/config/fml.toml
          echo 'eula=true' > run-beretta-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-beretta-server/server.properties
          convert src/main/resources/assets/fiskheroes/textures/models/beretta_93r.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/beretta_93r.png
          ./gradlew classes --no-daemon --console=plain
      - name: Capture beretta poses
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/beretta_visual_smoke.py 2>&1 | tee ci-beretta-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beretta-visual-diagnostics
          path: |
            ci-beretta-*.png
            ci-beretta-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/beretta_93r.png 
          mkdir -p .ci
          { cat ci-beretta-test.log 2>/dev/null || true; grep -E 'First-person beretta arm rendered|Held weapon livery: wearer=Dev.*beretta|Equipped suit item rendered: hero=fiskheroes:wild_dog' ci-beretta-client.log 2>/dev/null || true; echo '==== client tail ===='; tail -100 ci-beretta-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -50 ci-beretta-server.log 2>/dev/null || true; } > .ci/beretta-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for file in ci-beretta-{stowed-back,stowed-front,dual-front,dual-first,single-first,offhand,inventory-dual,inventory-single}.png; do
            test ! -f "$file" || cp "$file" ".ci/inspection-$file"
          done
          git add -f .ci/beretta-visual-log.txt
          for file in .ci/inspection-ci-beretta-*.png; do
            test ! -f "$file" || git add -f "$file"
          done
          git diff --cached --quiet || git commit -m 'ci: beretta visual diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 5
          done
          echo 'Failed to publish beretta diagnostics after retries' >&2
          exit 1
