name: decompile
on:
  workflow_dispatch:
jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Fetch CFR
        run: curl -sSL -o cfr.jar https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar
      - name: Decompile original jar
        run: |
          mkdir -p out
          java -Xmx3g -jar cfr.jar FiskHeroes-1.7.10-2.4.0.jar --outputdir out --silent true
          find out -name '*.java' | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: fisk-decompiled
          path: out
          compression-level: 9
