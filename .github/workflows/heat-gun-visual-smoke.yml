name: Heat Gun Visual Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/heat_gun_visual_smoke.py'
      - '.github/workflows/heat-gun-visual-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeatGunItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeatGunAimPose.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeatGunFlameEffects.java'
      - 'src/main/java/com/fiskmods/heroes/common/network/PacketHeatGunFlame.java'
      - 'src/main/java/com/fiskmods/heroes/client/ClientEventHandler.java'
      - 'src/main/java/com/fiskmods/heroes/common/event/CommonEventHandler.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/GunVisualEffects.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/DesertEagleAimPose.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemHeatGun.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemGun.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/WeaponHandRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroSuitLayer.java'
      - 'src/main/resources/assets/fiskheroes/models/heroes/heatwave.json'
      - 'src/main/java/com/fiskmods/heroes/client/render/DualWieldVisuals.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitItemRenderContext.java'
concurrency:
  group: heat-gun-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  heatgun:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare diagnostic texture on the runner only
        run: |
          chmod +x gradlew
          mkdir -p run-heat-gun-server run-heat-gun-client/config
          printf 'earlyWindowControl = false\n' > run-heat-gun-client/config/fml.toml
          echo 'eula=true' > run-heat-gun-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-heat-gun-server/server.properties
          convert src/main/resources/assets/fiskheroes/textures/models/heat_gun.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/heat_gun.png
          ./gradlew classes --no-daemon --console=plain
      - name: Capture heat gun poses
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/heat_gun_visual_smoke.py 2>&1 | tee ci-heat-gun-test.log
      - name: Capture original texture and nighttime lighting
        run: |
          set -o pipefail
          git restore src/main/resources/assets/fiskheroes/textures/models/heat_gun.png
          mkdir -p run-heat-gun-real-server run-heat-gun-real-client/config
          printf 'earlyWindowControl = false\n' > run-heat-gun-real-client/config/fml.toml
          echo 'eula=true' > run-heat-gun-real-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-heat-gun-real-server/server.properties
          ./gradlew classes --no-daemon --console=plain
          HEAT_GUN_REAL_TEXTURE=1 xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/heat_gun_visual_smoke.py 2>&1 | tee ci-heat-gun-real-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heat-gun-visual-diagnostics
          path: |
            ci-heat-gun-*.png
            ci-heat-gun-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/heat_gun.png
          mkdir -p .ci
          { cat ci-heat-gun-test.log 2>/dev/null || true; echo '==== client tail ===='; tail -100 ci-heat-gun-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -50 ci-heat-gun-server.log 2>/dev/null || true; } > .ci/heat-gun-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for file in ci-heat-gun-{first,third-front,inventory,aimed,offhand,open-flame,real-first,real-night,real-open-flame}.png; do
            test ! -f "$file" || cp "$file" ".ci/inspection-$file"
          done
          git add -f .ci/heat-gun-visual-log.txt .ci/inspection-ci-heat-gun-*.png
          git diff --cached --quiet || git commit -m 'ci: heat gun visual diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 5
          done
          echo 'Failed to publish heat gun diagnostics after retries' >&2
          exit 1
