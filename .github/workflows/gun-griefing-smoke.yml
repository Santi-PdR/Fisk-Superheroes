name: Beam Griefing Rules Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/gun_griefing_smoke.py'
      - '.ci/tonfa_visual_smoke.py'
      - '.ci/client_identity.gradle'
      - '.github/workflows/gun-griefing-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/common/config/SHConfig.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemColdGun.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemHeatGun.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemGun.java'
      - 'src/main/java/com/fiskmods/heroes/common/util/ProtectedBlockChanges.java'
concurrency:
  group: gun-griefing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  beams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless client dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool libgl1-mesa-dri
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare server and client
        run: |
          chmod +x gradlew
          mkdir -p run-gun-grief-server/config run-gun-grief-client/config
          printf 'earlyWindowControl = false\n' > run-gun-grief-client/config/fml.toml
          printf '[powers]\nallowGriefing = true\nallowColdGunGriefing = false\nallowHeatGunGriefing = false\n' > run-gun-grief-server/config/fiskheroes-common.toml
          echo 'eula=true' > run-gun-grief-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-gun-grief-server/server.properties
          ./gradlew classes --no-daemon --console=plain
      - name: Verify rules with a real client
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/gun_griefing_smoke.py 2>&1 | tee ci-gun-grief-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gun-griefing-diagnostics
          path: ci-gun-grief-*.log
          if-no-files-found: ignore
      - name: Summarize gameplay checks
        if: always()
        run: |
          {
            echo '## Beam griefing diagnostics'
            echo 'Full server/client logs: gun-griefing-diagnostics artifact.'
            echo '```'
            cat ci-gun-grief-test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish concise diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .ci
          { cat ci-gun-grief-test.log 2>/dev/null || true; echo '==== server tail ===='; tail -120 ci-gun-grief-server.log 2>/dev/null || true; echo '==== client tail ===='; tail -80 ci-gun-grief-client.log 2>/dev/null || true; } > .ci/gun-griefing-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/gun-griefing-log.txt
          git diff --cached --quiet || git commit -m 'ci: beam griefing diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 5
          done
          exit 1
