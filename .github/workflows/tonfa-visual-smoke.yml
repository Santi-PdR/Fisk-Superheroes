name: Tonfa Visual Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/tonfa_visual_smoke.py'
      - '.github/workflows/tonfa-visual-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/TacticalTonfaItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/TonfaHandRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroSuitLayer.java'
      - 'src/main/resources/assets/fiskheroes/models/heroes/black_canary.json'
concurrency:
  group: tonfa-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tonfa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=10,<14'
      - name: Use a high-contrast diagnostic texture on the runner only
        run: |
          chmod +x gradlew
          mkdir -p run-tonfa-server run-tonfa-client/config
          # Avoid Forge's early splash creating a competing GL context on Xvfb.
          printf 'earlyWindowControl = false\n' > run-tonfa-client/config/fml.toml
          echo 'eula=true' > run-tonfa-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-tonfa-server/server.properties
          convert src/main/resources/assets/fiskheroes/textures/models/tonfa.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/tonfa.png
          ./gradlew classes --no-daemon --console=plain
      - name: Capture actual poses
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/tonfa_visual_smoke.py 2>&1 | tee ci-tonfa-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tonfa-visual-diagnostics
          path: |
            ci-tonfa-*.png
            ci-tonfa-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/tonfa.png
          mkdir -p .ci
          { cat ci-tonfa-test.log 2>/dev/null || true; grep -E 'Tonfa hand pose|First-person tonfa arm|Equipped suit item rendered|ERROR|Exception' ci-tonfa-client.log 2>/dev/null || true; echo '==== client tail ===='; tail -100 ci-tonfa-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -50 ci-tonfa-server.log 2>/dev/null || true; } > .ci/tonfa-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/tonfa-visual-log.txt
          git diff --cached --quiet || git commit -m 'ci: tonfa visual diagnostics [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done
