name: Bo Staff Visual Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/bo_staff_visual_smoke.py'
      - '.github/workflows/bo-staff-visual-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/BoStaffItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitItemRenderContext.java'
concurrency:
  group: bo-staff-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  staff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=10,<14'
      - name: Prepare diagnostic texture on the runner only
        run: |
          chmod +x gradlew
          mkdir -p run-staff-server run-staff-client/config
          printf 'earlyWindowControl = false\n' > run-staff-client/config/fml.toml
          echo 'eula=true' > run-staff-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-staff-server/server.properties
          convert src/main/resources/assets/fiskheroes/textures/models/bo_staff.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/bo_staff.png
          ./gradlew classes --no-daemon --console=plain
      - name: Capture staff poses
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/bo_staff_visual_smoke.py 2>&1 | tee ci-staff-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bo-staff-visual-diagnostics
          path: |
            ci-staff-*.png
            ci-staff-*.log
          if-no-files-found: ignore
      - name: Temporarily publish captures for inspection
        if: always()
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/bo_staff.png
          mkdir -p .ci
          for f in ci-staff-*.png; do test ! -f "$f" || cp "$f" ".ci/inspection-$f"; done
          { cat ci-staff-test.log 2>/dev/null || true; echo '==== client tail ===='; tail -100 ci-staff-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -50 ci-staff-server.log 2>/dev/null || true; } > .ci/bo-staff-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/bo-staff-visual-log.txt
          for f in .ci/inspection-ci-staff-*.png; do test ! -f "$f" || git add -f "$f"; done
          git diff --cached --quiet || git commit -m 'ci: bo staff visual diagnostics [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done
