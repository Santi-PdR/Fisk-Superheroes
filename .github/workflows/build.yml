name: build
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - '.github/ci/build'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.8 --no-daemon
          fi
          chmod +x gradlew

      - name: Check packaged textures and trails
        run: |
          python3 .ci/verify_model_textures.py
          python3 .ci/verify_suit_textures.py
          python3 .ci/verify_trails.py

      - name: Build
        id: gradle
        run: |
          set +e
          ./gradlew build dumpApi --continue --no-daemon --stacktrace --console=plain > ci-build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -5 ci-build.log

      - name: Dump API signatures
        if: always()
        continue-on-error: true
        run: |
          ./gradlew dumpApi --no-daemon --console=plain >> ci-build.log 2>&1 || true

      - name: Publish build log back to the branch
        # Log commits can race with other CI jobs; they must not mask test results.
        continue-on-error: true
        if: always()
        run: |
          mkdir -p .ci
          grep -E -A3 "error:" ci-build.log | head -1500 > .ci/build-log.txt || true
          grep -E "Execution failed|FAILED|Caused by|\* What went wrong" ci-build.log | head -60 >> .ci/build-log.txt || true
          tail -40 ci-build.log >> .ci/build-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/build-log.txt .ci/api.txt
          git diff --cached --quiet || git commit -m "ci: build log [skip ci]" --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiskheroes-jars
          path: |
            build/libs/*.jar
          if-no-files-found: ignore
          compression-level: 0

      - name: Test machines and miniature suits in Forge
        if: steps.gradle.outputs.exit_code == '0'
        run: |
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\n' > run/server.properties
          set -o pipefail
          timeout -k 20 600 ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee ci-gametest.log
          # A zero-test run can exit successfully; require our regression suite to run.
          count=$(sed -nE 's/.*All ([0-9]+) required tests passed.*/\1/p' ci-gametest.log | tail -1)
          test "${count:-0}" -ge 48

      - name: Publish GameTest log
        # Log commits can race with other CI jobs; they must not mask test results.
        continue-on-error: true
        if: always() && hashFiles('ci-gametest.log') != ''
        run: |
          mkdir -p .ci
          { grep -iE 'gametest|test server|test(s)? (passed|failed)|required tests|alloy|fabricator|miniature|error|exception|BUILD ' ci-gametest.log || true; tail -100 ci-gametest.log; } > .ci/gametest-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/gametest-log.txt
          git diff --cached --quiet || git commit -m 'ci: gametest log [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done

      # Test the reobfuscated distributable, not only ForgeGradle's development classpath.
      - name: Boot a production Forge server with the built jar
        if: steps.gradle.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          version=$(sed -n 's/^forge_version=//p' gradle.properties)
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          server="$RUNNER_TEMP/fisk-production-server"
          mkdir -p "$server/mods"
          curl -fsSL --retry 3 "https://maven.minecraftforge.net/net/minecraftforge/forge/${minecraft}-${version}/forge-${minecraft}-${version}-installer.jar" -o "$RUNNER_TEMP/forge-installer.jar"
          java -jar "$RUNNER_TEMP/forge-installer.jar" --installServer "$server" > ci-production.log 2>&1
          cp build/libs/fiskheroes-1.20.1-2.4.0.jar "$server/mods/"
          echo 'eula=true' > "$server/eula.txt"
          printf 'online-mode=false\nmax-tick-time=-1\nspawn-protection=0\n' > "$server/server.properties"
          cd "$server"
          set +e
          (sleep 150; echo stop) | timeout -k 20 360 ./run.sh nogui >> "$GITHUB_WORKSPACE/ci-production.log" 2>&1
          code=${PIPESTATUS[1]}
          set -e
          cd "$GITHUB_WORKSPACE"
          tail -100 ci-production.log
          test "$code" -eq 0
          grep -q 'Done (' ci-production.log
          grep -q "Fisk's Superheroes ready:" ci-production.log
          ! grep -qE '#@!@# Game crashed|\[.*FATAL\]|Failed to load mod|Exception in thread "main"' ci-production.log
          test ! -d "$server/crash-reports"

      - name: Publish production server log
        # Log commits can race with other CI jobs; they must not mask test results.
        continue-on-error: true
        if: always() && hashFiles('ci-production.log') != ''
        run: |
          mkdir -p .ci
          { grep -iE 'fiskheroes|coremod|error|exception|fatal|Done \(|stopping server' ci-production.log | tail -300 || true; tail -120 ci-production.log; } > .ci/production-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/production-log.txt
          git diff --cached --quiet || git commit -m 'ci: production smoke log [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done

      - name: Publish preview release jar
        if: steps.gradle.outputs.exit_code == '0' && github.ref == 'refs/heads/arena/46651ecf-fisk-superheroes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh build/libs/
          TAG="v2.4.0-1.20.1-preview"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/libs/*.jar --clobber
            gh release edit "$TAG" --notes "Build automático de Minecraft 1.20.1 Forge (47.4.10+) desde la rama ${GITHUB_REF_NAME}."
          else
            gh release create "$TAG" build/libs/*.jar \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "Fisk's Superheroes 1.20.1 (2.4.0 Preview)" \
              --notes "Build automático de Minecraft 1.20.1 Forge (47.4.10+) desde la rama ${GITHUB_REF_NAME}."
          fi

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          if-no-files-found: ignore

      - name: Fail if Gradle build failed
        if: always() && steps.gradle.outputs.exit_code != '0'
        run: exit 1
