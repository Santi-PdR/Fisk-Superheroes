name: build
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
      - '.github/ci/build'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-read-only: false

      - name: Generate wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.8 --no-daemon
          fi
          chmod +x gradlew

      - name: Build
        id: gradle
        run: |
          set +e
          ./gradlew build dumpApi --no-daemon --stacktrace --console=plain > ci-build.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -5 ci-build.log

      - name: Publish build log back to the branch
        if: always()
        run: |
          mkdir -p .ci
          grep -E -A3 "error:" ci-build.log | head -1500 > .ci/build-log.txt || true
          grep -E "Execution failed|FAILED|Caused by|\* What went wrong" ci-build.log | head -60 >> .ci/build-log.txt || true
          tail -40 ci-build.log >> .ci/build-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/build-log.txt .ci/api.txt
          git diff --cached --quiet || git commit -m "ci: build log [skip ci]" --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiskheroes-jars
          path: |
            build/libs/*.jar
          if-no-files-found: ignore
          compression-level: 0

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          if-no-files-found: ignore
