name: Client World Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.ci/client_world_smoke.py'
      - '.github/workflows/client-world-smoke.yml'

concurrency:
  group: client-world-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless client dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot libgl1-mesa-dri libflite1
          python3 -m venv "$RUNNER_TEMP/nbt-venv"
          "$RUNNER_TEMP/nbt-venv/bin/pip" install nbtlib
      - name: Generate a world for Quick Play
        run: |
          chmod +x gradlew
          mkdir -p run
          echo 'eula=true' > run/eula.txt
          printf 'online-mode=false\nmax-tick-time=-1\nspawn-protection=0\n' > run/server.properties
          set +e
          (sleep 110; echo stop) | timeout -k 15 240 ./gradlew runServer --no-daemon --console=plain > ci-world-prepare.log 2>&1
          set -e
          test -s run/world/level.dat
          mkdir -p run/saves
          cp -a run/world run/saves/SmokeWorld
          "$RUNNER_TEMP/nbt-venv/bin/python" - <<'PY'
          import nbtlib
          world = nbtlib.load('run/saves/SmokeWorld/level.dat')
          world['Data']['allowCommands'] = nbtlib.Byte(1)
          world['Data']['GameType'] = nbtlib.Int(1)
          world.save()
          PY
      - name: Seed a legacy sound cache for migration
        run: |
          mkdir -p run/fiskheroes_sounds/pack/assets/fiskheroes/sounds
          echo 'fiskheroes:old.filename=old/filename.ogg' > run/fiskheroes_sounds/sounds.index
          echo '{"old.filename":{"sounds":["old/filename"]}}' > run/fiskheroes_sounds/pack/assets/fiskheroes/sounds.json
      - name: Exercise Flash and Vision in a real client world
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/client_world_smoke.py 2>&1 | tee ci-world-test.log
      - name: Upload world screenshot for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-world-screenshot
          path: |
            ci-world-screenshot.jpg
            ci-antman-screenshot.jpg
            ci-batman-cape-screenshot.jpg
            ci-crossbones-screenshot.jpg
            ci-wingsuit-screenshot.jpg
            ci-shadow-screenshot.jpg
            ci-equipped-shield.jpg
            ci-equipped-deadpool.jpg
            ci-equipped-batman.jpg
            ci-held-katana.jpg
            ci-canary-stowed.jpg
            ci-tonfa-before.jpg
            ci-tonfa-after.jpg
          if-no-files-found: ignore
      - name: Publish world client log
        if: always() && hashFiles('ci-client-world.log') != ''
        run: |
          mkdir -p .ci
          { cat ci-world-test.log 2>/dev/null || true; grep -iE 'fiskheroes|logged in|joined the game|issued server command|error|exception|failed|fatal|Drawing suit' ci-client-world.log | tail -300 || true; tail -100 ci-client-world.log; } > .ci/client-world-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in ci-canary-stowed.jpg ci-tonfa-before.jpg ci-tonfa-after.jpg; do
            test ! -f "$f" || cp "$f" ".ci/inspection-$f"
          done
          git add -f .ci/client-world-log.txt
          for f in .ci/inspection-ci-canary-stowed.jpg .ci/inspection-ci-tonfa-before.jpg .ci/inspection-ci-tonfa-after.jpg; do
            test ! -f "$f" || git add -f "$f"
          done
          git diff --cached --quiet || git commit -m 'ci: client world smoke log [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done
