name: DesertEagle Visual Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/desert_eagle_visual_smoke.py'
      - '.github/workflows/desert_eagle-visual-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/DesertEagleItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/WeaponHandRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroSuitLayer.java'
      - 'src/main/resources/assets/fiskheroes/models/heroes/deadpool_xmen.json'
      - 'src/main/java/com/fiskmods/heroes/client/render/DualWieldVisuals.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitItemRenderContext.java'
concurrency:
  group: desert_eagle-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desert_eagle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare diagnostic texture on the runner only
        run: |
          chmod +x gradlew
          mkdir -p run-desert_eagle-server run-desert_eagle-client/config
          printf 'earlyWindowControl = false\n' > run-desert_eagle-client/config/fml.toml
          echo 'eula=true' > run-desert_eagle-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-desert_eagle-server/server.properties
          convert src/main/resources/assets/fiskheroes/textures/models/desert_eagle.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/desert_eagle.png
          convert src/main/resources/assets/fiskheroes/textures/heroes/deadpool_xmen_gun.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/heroes/deadpool_xmen_gun.png
          ./gradlew classes --no-daemon --console=plain
      - name: Capture desert_eagle poses
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/desert_eagle_visual_smoke.py 2>&1 | tee ci-desert_eagle-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desert_eagle-visual-diagnostics
          path: |
            ci-desert_eagle-*.png
            ci-desert_eagle-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/desert_eagle.png src/main/resources/assets/fiskheroes/textures/heroes/deadpool_xmen_gun.png
          mkdir -p .ci
          { cat ci-desert_eagle-test.log 2>/dev/null || true; grep -E 'First-person desert_eagle arm rendered|Held weapon livery: wearer=Dev.*desert_eagle|Equipped suit item rendered: hero=fiskheroes:deadpool_xmen' ci-desert_eagle-client.log 2>/dev/null || true; echo '==== client tail ===='; tail -100 ci-desert_eagle-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -50 ci-desert_eagle-server.log 2>/dev/null || true; } > .ci/desert_eagle-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in ci-desert_eagle-*.png; do test ! -f "$f" || cp "$f" ".ci/inspection-$f"; done
          git add -f .ci/desert_eagle-visual-log.txt
          for f in .ci/inspection-ci-desert_eagle-*.png; do test ! -f "$f" || git add -f "$f"; done
          git diff --cached --quiet || git commit -m 'ci: desert_eagle visual diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 5
          done
          echo 'Failed to publish desert_eagle diagnostics after retries' >&2
          exit 1
