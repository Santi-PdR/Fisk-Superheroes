name: Cold Gun Sound Multiplayer Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/cold_gun_sound_multiplayer.py'
      - '.ci/prepare_cold_audio.py'
      - '.github/workflows/cold-gun-sound-multiplayer.yml'
      - 'src/main/java/com/fiskmods/heroes/client/sound/ColdGunBeamSound.java'
      - 'src/main/java/com/fiskmods/heroes/client/sound/ColdGunStartSound.java'
      - 'src/main/java/com/fiskmods/heroes/client/sound/SHSoundPlayer.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemColdGun.java'
      - 'src/main/java/com/fiskmods/heroes/common/data/var/Vars.java'
      - 'src/main/java/com/fiskmods/heroes/common/sound/SoundManifest.java'
      - 'src/main/java/com/fiskmods/heroes/common/sound/OggVorbisChannels.java'
      - 'src/main/java/com/fiskmods/heroes/common/network/PacketSyncData.java'
      - 'src/main/java/com/fiskmods/heroes/common/data/DataSyncer.java'
      - 'src/main/java/com/fiskmods/heroes/client/ClientEventHandler.java'
      - 'src/main/resources/heropack.json'
      - '.ci/client_identity.gradle'
concurrency:
  group: cold-gun-sound-${{ github.ref }}
  cancel-in-progress: true
jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool libgl1-mesa-dri libflite1 pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=fisk_capture rate=44100 channels=2
          pactl set-default-sink fisk_capture
      - name: Prepare clients and sound cache
        run: |
          chmod +x gradlew
          mkdir -p run-cold-sound-server run-cold-sound-observer/config run-cold-sound-shooter/config
          printf 'earlyWindowControl = false\n' | tee run-cold-sound-observer/config/fml.toml > run-cold-sound-shooter/config/fml.toml
          printf 'soundCategory_music:0.0\nsoundCategory_ambient:0.0\nsoundCategory_weather:0.0\n' > run-cold-sound-observer/options.txt
          echo 'eula=true' > run-cold-sound-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=10\nsimulation-distance=3\n' > run-cold-sound-server/server.properties
          curl --fail --location --retry 3 -o /tmp/fisk-cold-sounds.zip https://raw.githubusercontent.com/FiskFille/Superheroes/master/sounds/3.zip
          CI_COLD_LONG_START=1 python3 .ci/prepare_cold_audio.py /tmp/fisk-cold-sounds.zip run-cold-sound-observer run-cold-sound-shooter
          ./gradlew classes --no-daemon --console=plain
      - name: Exercise moving loop on two clients
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/cold_gun_sound_multiplayer.py 2>&1 | tee ci-cold-sound-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-gun-sound-diagnostics
          path: ci-cold-sound-*.log
          if-no-files-found: ignore
      - name: Publish summary
        if: always()
        run: |
          {
            echo '## Cold Gun sound multiplayer diagnostics'
            echo 'Full logs: cold-gun-sound-diagnostics artifact.'
            echo '```'
            cat ci-cold-sound-test.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish diagnostics to branch
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .ci
          { cat ci-cold-sound-test.log 2>/dev/null || true; for f in ci-cold-sound-*.log; do echo "==== $f ===="; tail -100 "$f" 2>/dev/null || true; done; } > .ci/cold-gun-sound-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/cold-gun-sound-log.txt
          git diff --cached --quiet || git commit -m 'ci: cold-gun-sound diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep 5
          done
          exit 1
