name: Player Animator Compatibility
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/playeranim-compat.yml'
      - '.ci/playeranim.gradle'
      - '.ci/held_livery_multiplayer.py'
      - '.ci/client_identity.gradle'
      - 'src/main/resources/coremods/**'
      - 'src/main/java/com/fiskmods/heroes/client/render/**'
      - 'build.gradle'
      - 'gradle.properties'
concurrency:
  group: playeranim-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless graphics and pinned Player Animator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool libgl1-mesa-dri libflite1
          mkdir -p .ci/playeranim-dependency
          curl -fL --retry 3 'https://cdn.modrinth.com/data/gedNE4y2/versions/xe2EVE6q/player-animation-lib-forge-1.0.2-rc1%2B1.20.jar' -o .ci/playeranim-dependency/playeranim-1.0.2.jar
          echo '16808f94a41d45d8e986b4e4ea6b02ba57fa058a  .ci/playeranim-dependency/playeranim-1.0.2.jar' | sha1sum -c -
      - name: Prepare server and clients
        run: |
          chmod +x gradlew
          mkdir -p run-livery-server run-livery-observer/config run-livery-wearer/config
          printf 'earlyWindowControl = false\n' > run-livery-observer/config/fml.toml
          printf 'earlyWindowControl = false\n' > run-livery-wearer/config/fml.toml
          echo 'eula=true' > run-livery-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-livery-server/server.properties
      - name: Test real Player Animator with two players
        run: |
          set -o pipefail
          export GRADLE_OPTS="-Dorg.gradle.jvmargs=-Xmx512m"
          # Inject the dependency into each Gradle invocation, including subprocesses.
          mkdir -p "$HOME/.gradle/init.d"
          cp .ci/playeranim.gradle "$HOME/.gradle/init.d/playeranim.gradle"
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/held_livery_multiplayer.py 2>&1 | tee ci-playeranim-test.log
          grep -qi 'playeranimator' ci-held-multiplayer-observer.log
          ! grep -qE 'Critical injection failure|InjectionError|Mixin apply failed|Error occurred applying transform of coremod' ci-held-multiplayer-observer.log
          grep -q 'playerAnimator.*ItemInHandRendererMixin' ci-held-multiplayer-observer.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playeranim-compat-diagnostics
          path: |
            ci-playeranim-test.log
            ci-held-multiplayer-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          { cat ci-playeranim-test.log 2>/dev/null || true; for f in server observer wearer; do echo "==== $f errors ===="; grep -iE 'playeranim|injection|mixin|exception|error|fatal|livery' "ci-held-multiplayer-$f.log" 2>/dev/null | tail -120 || true; echo "==== $f tail ===="; tail -100 "ci-held-multiplayer-$f.log" 2>/dev/null || true; done; } > /tmp/playeranim-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            cp /tmp/playeranim-log.txt .ci/playeranim-log.txt
            git add -f .ci/playeranim-log.txt
            git diff --cached --quiet && break
            git commit -m 'ci: player animator compatibility log [skip ci]' --no-verify
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
