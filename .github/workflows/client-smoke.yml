name: Client Smoke Test

on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'
      - '.github/workflows/client-smoke.yml'

concurrency:
  group: client-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless graphics
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libflite1
      - name: Boot the client
        id: boot
        run: |
          chmod +x gradlew
          set +e
          ALSOFT_DRIVERS=null LIBGL_ALWAYS_SOFTWARE=1 timeout -k 20 300 xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew runClient --no-daemon --console=plain > ci-client.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if grep -qE 'Created: .*minecraft:textures/atlas/blocks.png-atlas' ci-client.log \
              && grep -q 'Sound engine started' ci-client.log \
              && ! grep -qE '#@!@# Game crashed|\[.*\/FATAL\]|BUILD FAILED' ci-client.log \
              && [ ! -d run/crash-reports ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
          tail -100 ci-client.log
      - name: Publish client log
        if: always() && hashFiles('ci-client.log') != ''
        run: |
          mkdir -p .ci
          {
            echo "==== notable client messages ===="
            grep -iE 'fiskheroes|atlas/blocks|game crashed|error|exception|missing texture|failed|fatal|sound engine started|BUILD ' ci-client.log | tail -300 || true
            echo "==== crash reports ===="
            if [ -d run/crash-reports ]; then cat run/crash-reports/*; fi
            echo "==== tail ===="
            tail -120 ci-client.log
          } > .ci/client-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/client-log.txt
          git diff --cached --quiet || git commit -m 'ci: client smoke log [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done
      - name: Require a successful client startup
        if: always()
        run: test '${{ steps.boot.outputs.ready }}' = 'true'
