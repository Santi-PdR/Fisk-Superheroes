name: Scythe Visual Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/scythe_visual_smoke.py'
      - '.github/workflows/scythe-visual-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/RuptureScytheItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/ScytheChargeRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/WeaponHandRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroSuitLayer.java'
      - 'src/main/resources/assets/fiskheroes/models/heroes/rupture.json'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitItemRenderContext.java'
concurrency:
  group: scythe-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scythe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare diagnostic texture on the runner only
        run: |
          chmod +x gradlew
          mkdir -p run-scythe-server run-scythe-client/config
          printf 'earlyWindowControl = false\n' > run-scythe-client/config/fml.toml
          echo 'eula=true' > run-scythe-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-scythe-server/server.properties
          convert src/main/resources/assets/fiskheroes/textures/models/ruptures_scythe.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/ruptures_scythe.png
          ./gradlew classes --no-daemon --console=plain
      - name: Capture scythe poses
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/scythe_visual_smoke.py 2>&1 | tee ci-scythe-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scythe-visual-diagnostics
          path: |
            ci-scythe-*.png
            ci-scythe-*.log
          if-no-files-found: ignore
      - name: Temporarily publish captures for inspection
        if: always()
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/ruptures_scythe.png
          mkdir -p .ci
          { cat ci-scythe-test.log 2>/dev/null || true; grep -E 'Scythe charge arcs|Equipped suit item rendered: hero=fiskheroes:rupture' ci-scythe-client.log 2>/dev/null || true; echo '==== client tail ===='; tail -100 ci-scythe-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -50 ci-scythe-server.log 2>/dev/null || true; } > .ci/scythe-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for f in ci-scythe-*.png; do test ! -f "$f" || cp "$f" ".ci/inspection-$f"; done
          git add -f .ci/scythe-visual-log.txt
          for f in .ci/inspection-ci-scythe-*.png; do test ! -f "$f" || git add -f "$f"; done
          git diff --cached --quiet || git commit -m 'ci: scythe visual diagnostics [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done
