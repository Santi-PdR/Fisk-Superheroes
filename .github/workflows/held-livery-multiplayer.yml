name: Held Livery Multiplayer Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/held_livery_multiplayer.py'
      - '.ci/client_identity.gradle'
      - '.github/workflows/held-livery-multiplayer.yml'
      - 'build.gradle'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitItemRenderContext.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroSuitLayer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/KatanaItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/DesertEagleItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/HeroTracker.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/ItemHeroArmor.java'
      - 'src/main/resources/coremods/held_item_livery.js'
      - 'src/main/resources/coremods/dual_wield_visuals.js'
      - 'src/main/java/com/fiskmods/heroes/client/render/DualWieldVisuals.java'
      - 'src/main/resources/META-INF/coremods.json'
      - 'src/main/resources/assets/fiskheroes/models/heroes/deadpool_xmen.json'
      - 'src/main/resources/assets/fiskheroes/models/heroes/deathstroke_dceu.json'

concurrency:
  group: held-livery-multiplayer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless client dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libflite1
      - name: Prepare dedicated server and clients
        run: |
          chmod +x gradlew
          mkdir -p run-livery-server run-livery-observer run-livery-wearer
          echo 'eula=true' > run-livery-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-livery-server/server.properties
          ./gradlew classes --no-daemon --console=plain
      - name: Render two players with different suit liveries
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/held_livery_multiplayer.py 2>&1 | tee ci-held-multiplayer-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: held-livery-multiplayer-diagnostics
          path: ci-held-multiplayer-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          mkdir -p .ci
          { cat ci-held-multiplayer-test.log 2>/dev/null || true; for f in server observer wearer; do echo "==== $f launch ===="; grep -E 'CI launch identity|Setting user:|logged in with entity|Held weapon livery|Drawing suit' "ci-held-multiplayer-$f.log" 2>/dev/null || true; echo "==== $f tail ===="; tail -100 "ci-held-multiplayer-$f.log" 2>/dev/null || true; done; } > .ci/held-livery-multiplayer-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/held-livery-multiplayer-log.txt
          git diff --cached --quiet || git commit -m 'ci: held livery multiplayer log [skip ci]' --no-verify
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" >/dev/null 2>&1 || true
            git push && break
            sleep 5
          done
