name: Shield Control Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/shield_control_smoke.py'
      - '.github/workflows/shield-control-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/ClientEventHandler.java'
      - 'src/main/java/com/fiskmods/heroes/client/ClientModEvents.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/ThrownShieldRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/CaptainAmericaShieldItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/WeaponHandRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/ability/AbilityHandler.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/modifier/ModifierShieldThrowing.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/modifier/ItemShieldBlocking.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/modifier/ShieldRecovery.java'
      - 'src/main/java/com/fiskmods/heroes/common/network/PacketThrowShield.java'
      - 'src/main/java/com/fiskmods/heroes/common/entity/projectile/ThrownShieldEntity.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemCaptainAmericaShield.java'
      - 'src/main/resources/assets/fiskheroes/data/heroes/captain_america.js'
      - 'src/main/resources/assets/fiskheroes/data/powers/shield_throwing.json'
concurrency:
  group: shield-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shield:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        input: [mouse, keyboard]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless client dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare dedicated server and client
        run: |
          chmod +x gradlew
          prefix="run-shield-control-${{ matrix.input }}"
          mkdir -p "$prefix-server" "$prefix-client/config"
          printf 'earlyWindowControl = false\n' > "$prefix-client/config/fml.toml"
          echo 'eula=true' > "$prefix-server/eula.txt"
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > "$prefix-server/server.properties"
          convert src/main/resources/assets/fiskheroes/textures/models/captain_americas_shield.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/captain_americas_shield.png
          ./gradlew classes --no-daemon --console=plain
      - name: Test shield controls with a real client
        env:
          SHIELD_KEYBOARD: ${{ matrix.input == 'keyboard' && '1' || '0' }}
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/shield_control_smoke.py 2>&1 | tee ci-shield-control-${{ matrix.input }}-test.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shield-control-${{ matrix.input }}
          path: |
            ci-shield-control-${{ matrix.input }}-*.log
            ci-shield-control-${{ matrix.input }}-*.png
          if-no-files-found: ignore
      - name: Publish concise test diagnostics
        if: always()
        continue-on-error: true
        run: |
          mkdir -p .ci
          log=".ci/shield-control-${{ matrix.input }}-log.txt"
          { cat ci-shield-control-${{ matrix.input }}-test.log 2>/dev/null || true
            echo '==== relevant server events ===='
            grep -E 'Shield throw|Shield item|Ability input|SHIELD_|Health|health|damage|armor_stand|Exception|ERROR' ci-shield-control-${{ matrix.input }}-server.log 2>/dev/null | tail -100 || true
            echo '==== projectile diagnostics ===='
            grep 'Thrown shield visual sample:' ci-shield-control-${{ matrix.input }}-client.log 2>/dev/null | tail -30 || true
            echo '==== client tail ===='
            tail -80 ci-shield-control-${{ matrix.input }}-client.log 2>/dev/null || true
          } > "$log"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f "$log"
          git diff --cached --quiet || git commit -m 'ci: shield ${{ matrix.input }} diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            sleep 5
          done
          exit 1
