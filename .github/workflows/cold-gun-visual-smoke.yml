name: Cold Gun Visual Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/cold_gun_visual_smoke.py'
      - '.github/workflows/cold-gun-visual-smoke.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/ColdGunItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/ColdGunAimPose.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/ColdBallRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/common/entity/projectile/ColdBallEntity.java'
      - 'src/main/java/com/fiskmods/heroes/client/ClientEventHandler.java'
      - 'src/main/java/com/fiskmods/heroes/common/event/CommonEventHandler.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/GunVisualEffects.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/DesertEagleAimPose.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemColdGun.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemGun.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/WeaponHandRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroSuitLayer.java'
      - 'src/main/resources/assets/fiskheroes/models/heroes/captain_cold.json'
      - 'src/main/java/com/fiskmods/heroes/client/render/DualWieldVisuals.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitItemRenderContext.java'
concurrency:
  group: cold-gun-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  coldgun:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare diagnostic texture on the runner only
        run: |
          chmod +x gradlew
          mkdir -p run-cold-gun-server run-cold-gun-client/config
          printf 'earlyWindowControl = false\n' > run-cold-gun-client/config/fml.toml
          echo 'eula=true' > run-cold-gun-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-cold-gun-server/server.properties
          convert src/main/resources/assets/fiskheroes/textures/models/cold_gun.png -channel RGB -fill '#ff00ff' -colorize 100% +channel src/main/resources/assets/fiskheroes/textures/models/cold_gun.png
          ./gradlew classes --no-daemon --console=plain
      - name: Capture cold gun poses
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/cold_gun_visual_smoke.py 2>&1 | tee ci-cold-gun-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-gun-visual-diagnostics
          path: |
            ci-cold-gun-*.png
            ci-cold-gun-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/cold_gun.png
          mkdir -p .ci
          { cat ci-cold-gun-test.log 2>/dev/null || true; echo '==== client tail ===='; tail -100 ci-cold-gun-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -50 ci-cold-gun-server.log 2>/dev/null || true; } > .ci/cold-gun-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/cold-gun-visual-log.txt
          git diff --cached --quiet || git commit -m 'ci: cold gun visual diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 5
          done
          echo 'Failed to publish cold gun diagnostics after retries' >&2
          exit 1
