name: Trick Arrow Smoke Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/trick_arrow_smoke.py'
      - '.ci/small_player_smoke.py'
      - '.github/workflows/trick-arrow-smoke.yml'
      - '.ci/client_identity.gradle'
      - 'build.gradle'
      - 'src/main/java/com/fiskmods/heroes/common/data/SHPlayerData.java'
      - 'src/main/java/com/fiskmods/heroes/common/data/DataSyncer.java'
      - 'src/main/java/com/fiskmods/heroes/common/data/var/DataContainer.java'
      - 'src/main/java/com/fiskmods/heroes/common/entity/arrow/TrickArrowEntity.java'
      - 'src/main/java/com/fiskmods/heroes/common/item/ItemTrickArrow.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/TrickArrowRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeroModelData.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/ParticleEmitterRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/BoosterFlameRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/BeamConstellationRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/ProjectionBeamRenderHandler.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/HeatVisionRenderHandler.java'
      - 'src/main/java/com/fiskmods/heroes/common/util/BeamLayout.java'
      - 'src/main/resources/assets/fiskheroes/models/heroes/martian_manhunter_comics.json'
      - 'src/main/java/com/fiskmods/heroes/client/render/SuitFlamesRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/FirstPersonSuitArms.java'
      - 'src/main/java/com/fiskmods/heroes/common/util/AnimatedSpriteFrames.java'
      - 'src/main/resources/assets/fiskheroes/textures/icons/**'
      - 'src/main/resources/assets/fiskheroes/models/heroes/firestorm*.json'
      - 'src/main/java/com/fiskmods/heroes/client/render/CloudSmokeParticle.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/TeleportBurstEffects.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/TeleportBurstParticle.java'
      - 'src/main/java/com/fiskmods/heroes/common/network/PacketTeleportBurst.java'
      - 'src/main/java/com/fiskmods/heroes/common/util/TeleportBurstMath.java'
      - 'src/main/java/com/fiskmods/heroes/common/util/CloudColors.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/modifier/ModifierAbilities.java'
      - 'src/main/resources/assets/fiskheroes/models/clouds/**'
      - 'src/main/resources/assets/fiskheroes/models/heroes/the_monitor.json'
      - '.ci/particle_thumbnails.py'
      - 'src/main/resources/assets/fiskheroes/models/heroes/mysterio.json'
      - 'src/main/java/com/fiskmods/heroes/client/texture/TextureResolver.java'
      - 'src/main/java/com/fiskmods/heroes/client/texture/TextureRouteCache.java'
      - 'src/main/java/com/fiskmods/heroes/pack/js/ExpressionCache.java'
      - 'src/main/java/com/fiskmods/heroes/common/data/DataRegistry.java'
concurrency:
  group: trick-arrow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot libgl1-mesa-dri libflite1 python3-pil
      - name: Prepare server and client
        run: |
          chmod +x gradlew
          mkdir -p run-arrow-server run-arrow-client/config
          printf 'earlyWindowControl = false\n' > run-arrow-client/config/fml.toml
          echo 'eula=true' > run-arrow-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-arrow-server/server.properties
          ./gradlew classes --no-daemon --console=plain
      - name: Exercise trick arrows
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/trick_arrow_smoke.py 2>&1 | tee ci-arrow-test.log
      - name: Upload captures and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arrow-diagnostics
          path: |
            ci-arrow-*.png
            ci-arrow-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          { cat ci-arrow-test.log 2>/dev/null || true; for f in server client; do echo "==== $f diagnostics ===="; grep -E 'ARROW_|Exception|Error|FATAL' "ci-arrow-$f.log" 2>/dev/null | tail -100 || true; echo "==== $f tail ===="; tail -80 "ci-arrow-$f.log" 2>/dev/null || true; done; } > /tmp/arrow-log.txt
          # Small diagnostic thumbnails travel with the existing log when artifact storage is
          # unreachable; full-resolution captures remain in the uploaded artifact.
          python3 .ci/particle_thumbnails.py >> /tmp/arrow-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            cp /tmp/arrow-log.txt .ci/arrow-log.txt
            git add -f .ci/arrow-log.txt
            git diff --cached --quiet && break
            git commit -m 'ci: trick arrow diagnostics [skip ci]' --no-verify
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
