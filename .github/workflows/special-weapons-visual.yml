name: Special Weapons Visual Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/special_weapons_visual_smoke.py'
      - '.ci/tonfa_visual_smoke.py'
      - '.ci/client_identity.gradle'
      - 'src/main/resources/assets/fiskheroes/textures/models/grappling_gun.png'
      - 'src/main/resources/assets/fiskheroes/textures/models/chronos_rifle*.png'
      - 'src/main/resources/assets/fiskheroes/textures/models/rip_hunters_gun*.png'
      - '.github/workflows/special-weapons-visual.yml'
      - 'src/main/java/com/fiskmods/heroes/client/render/GrapplingGunItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/ChronosRifleItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/RipHuntersGunItemRenderer.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/WeaponHandRenderer.java'
concurrency:
  group: special-weapons-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool scrot imagemagick libgl1-mesa-dri libflite1
          python3 -m pip install --user 'pillow>=13,<14'
      - name: Prepare runner-only diagnostic textures
        run: |
          chmod +x gradlew
          mkdir -p run-special-weapons-server run-special-weapons-client/config
          printf 'earlyWindowControl = false\n' > run-special-weapons-client/config/fml.toml
          echo 'eula=true' > run-special-weapons-server/eula.txt
          printf 'version:3465\ntutorialStep:none\n' > run-special-weapons-client/options.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-special-weapons-server/server.properties
          for f in grappling_gun chronos_rifle rip_hunters_gun; do
            convert "src/main/resources/assets/fiskheroes/textures/models/$f.png" -channel RGB -fill '#ff00ff' -colorize 100% +channel "src/main/resources/assets/fiskheroes/textures/models/$f.png"
          done
          ./gradlew classes --no-daemon --console=plain
      - name: Capture hands
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/special_weapons_visual_smoke.py 2>&1 | tee ci-special-weapons-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: special-weapons-visual
          path: |
            ci-special-weapons-*.png
            ci-special-weapons-*.log
          if-no-files-found: ignore
      - name: Publish diagnostics
        if: always()
        continue-on-error: true
        run: |
          git restore src/main/resources/assets/fiskheroes/textures/models/{grappling_gun,chronos_rifle,rip_hunters_gun}.png
          { cat ci-special-weapons-test.log 2>/dev/null || true; echo '==== client tail ===='; tail -40 ci-special-weapons-client.log 2>/dev/null || true; echo '==== server tail ===='; tail -40 ci-special-weapons-server.log 2>/dev/null || true; } > .ci/special-weapons-visual-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f .ci/special-weapons-visual-log.txt
          git diff --cached --quiet || git commit -m 'ci: special weapon visual diagnostics [skip ci]' --no-verify
          for i in $(seq 1 20); do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then exit 0; fi
            sleep 5
          done
          exit 1
