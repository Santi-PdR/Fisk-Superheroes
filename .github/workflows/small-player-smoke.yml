name: Small Player Tunnel Test
on:
  workflow_dispatch:
  push:
    branches: ['arena/**']
    paths:
      - '.ci/small_player_smoke.py'
      - '.ci/client_identity.gradle'
      - '.github/workflows/small-player-smoke.yml'
      - 'src/main/resources/coremods/scaled_pose_collision.js'
      - 'src/main/resources/META-INF/coremods.json'
      - 'src/main/java/com/fiskmods/heroes/common/hero/ability/PlayerSizeHandler.java'
      - 'src/main/java/com/fiskmods/heroes/common/hero/modifier/ModifierAbilities.java'
      - 'src/main/java/com/fiskmods/heroes/client/render/SizeCameraDiagnostics.java'
      - 'src/main/resources/assets/fiskheroes/data/powers/atom_exosuit.json'
      - 'src/main/resources/assets/fiskheroes/data/powers/pym_particles.json'
      - 'build.gradle'
concurrency:
  group: small-player-tunnel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install headless dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool libgl1-mesa-dri libflite1
      - name: Prepare server and client
        run: |
          chmod +x gradlew
          mkdir -p run-small-server run-small-client/config
          printf 'earlyWindowControl = false\n' > run-small-client/config/fml.toml
          echo 'eula=true' > run-small-server/eula.txt
          printf 'online-mode=false\nlevel-type=flat\nmax-tick-time=-1\nspawn-protection=0\nallow-flight=true\nview-distance=3\nsimulation-distance=3\n' > run-small-server/server.properties
          ./gradlew classes --no-daemon --console=plain
      - name: Exercise small player collision and camera
        run: |
          set -o pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' python3 .ci/small_player_smoke.py 2>&1 | tee ci-small-test.log
          ! grep -q 'Error occurred applying transform of coremod' ci-small-client.log
          ! grep -q 'Error occurred applying transform of coremod' ci-small-server.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: small-player-diagnostics
          path: ci-small-*.log
          if-no-files-found: ignore
      - name: Publish diagnostic summary
        if: always()
        run: |
          { cat ci-small-test.log 2>/dev/null || true; for f in server client; do echo "==== $f diagnostics ===="; grep -E 'Size pose:|Size camera:|scaled_pose_collision|Error occurred applying transform of coremod|Exception|FATAL' "ci-small-$f.log" 2>/dev/null | tail -120 || true; echo "==== $f tail ===="; tail -80 "ci-small-$f.log" 2>/dev/null || true; done; } > /tmp/small-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for i in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            cp /tmp/small-log.txt .ci/small-player-log.txt
            git add -f .ci/small-player-log.txt
            git diff --cached --quiet && break
            git commit -m 'ci: small player tunnel diagnostics [skip ci]' --no-verify
            git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep 5
          done
